name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game/app:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Configure package and build
        env:
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
        run: |
          chmod +x ./gradlew
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          package = os.environ['PACKAGE_NAME'].strip()
          if not re.fullmatch(r'[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)+', package):
              raise SystemExit(f'Invalid Android package name: {package!r}')
          game = Path('module/src/main/cpp/game.h')
          game.write_text(game.read_text().replace('com.game.packagename', package))
          module = Path('module.gradle')
          text = module.read_text()
          text = text.replace('moduleDescription = "', f'moduleDescription = "({package}) ', 1)
          module.write_text(text)
          PY
          ./gradlew :module:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/*.zip
          if-no-files-found: error
